allowBuilds:
  cpu-features: false
  esbuild: true
  protobufjs: false
  sharp: false
  ssh2: false
  unrs-resolver: false
overrides:
  # Drizzle Kit's legacy loader allows esbuild 0.18.x; this scoped override
  # keeps that toolchain on the fixed 0.25 line without changing other callers.
  "@esbuild-kit/core-utils>esbuild": 0.25.12
